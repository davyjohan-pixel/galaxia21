name: Compilar App Android (Play Store AAB + APK)

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Generar AAB para Play Store y APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar Licencias de Android SDK Preinstalado
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Asegurar Keystore Permanente de Firma Oficial (Inversiones Lempira)
        working-directory: android-app
        run: |
          if [ ! -f "galaxia21-release.jks" ]; then
            keytool -genkeypair -v \
              -keystore galaxia21-release.jks \
              -alias galaxia21 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass galaxia21hrns \
              -keypass galaxia21hrns \
              -dname "CN=Radio Galaxia 21 HRNS, OU=Radiodifusion, O=Inversiones Lempira, L=Gracias, ST=Lempira, C=HN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add galaxia21-release.jks
            git commit -m "chore(android): persist official release keystore for Play Store updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Compilar Android App Bundle (.aab) y APK (.apk) de Produccion
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android-app/galaxia21-release.jks
          KEYSTORE_PASSWORD: galaxia21hrns
          KEY_ALIAS: galaxia21
          KEY_PASSWORD: galaxia21hrns
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Subir Paquete Oficial para Google Play Store (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Galaxia21-PlayStore-AAB
          path: android-app/app/build/outputs/bundle/release/*.aab

      - name: Subir Instalador Directo para Celular (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Galaxia21-Instalador-APK
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Subir Llave de Firma Digital (Keystore Respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: Galaxia21-Keystore-Firma
          path: android-app/galaxia21-release.jks
